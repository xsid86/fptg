<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming call</title>
<link rel="stylesheet" href="assets/scss/style.css">
<script>
  // Тема — до первой отрисовки, как в index.html: тот же выбор из
  // localStorage (общий профиль WebView2), иначе Aurora.
  try {
    var t = localStorage.getItem('theme');
    // dark | light | dark-plain | light-plain | dark-aurora (ui/theme.js):
    // схема — в data-theme, у простых и Aurora ещё data-style (plain | aurora).
    // Нет выбора — Aurora (DEFAULT_THEME там же).
    if (!/^(dark|light)(-plain|-aurora)?$/.test(t || '')) { t = 'dark-aurora'; }
    document.documentElement.dataset.theme = t.indexOf('dark') === 0 ? 'dark' : 'light';
    var s = /-(plain|aurora)$/.exec(t);
    if (s) { document.documentElement.dataset.style = s[1]; }
    // Акцент (Settings → General, ui/theme.js): ключ из $app-accents.
    var a = localStorage.getItem('accent');
    if (/^[a-z]+$/.test(a || '')) { document.documentElement.dataset.accent = a; }
  } catch (e) {
    // Хранилище закрыто — тема по умолчанию, Aurora.
    document.documentElement.dataset.theme = 'dark';
    document.documentElement.dataset.style = 'aurora';
  }
</script>
</head>
<body class="callcard-page">
<!-- Карточка входящего звонка в отдельном окошке поверх всех окон
     (оболочка: callpopup.pas). Всё нужное — в адресе: id, name, video,
     avatar, thumb. Сервера не спрашивает: нажатия уходят оболочке,
     та передаёт их главной странице (ui/call.js). -->
<script type="module" src="assets/js/callcard.js"></script>
</body>
</html>
