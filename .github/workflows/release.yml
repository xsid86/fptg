# Builds a Windows release on GitHub's own machines, signs the programs
# through SignPath (once the project is approved) and drafts a GitHub
# Release with the archives.
#
# Start it:
#   - by pushing a tag:  git tag v1.0.0  then  git push origin v1.0.0
#   - or by hand: Actions → Release → Run workflow, enter the version.
#
# Repository settings it reads (Settings → Secrets and variables → Actions):
#   secrets.SIGNPATH_API_TOKEN       the SignPath API token; without it the
#                                    programs are left unsigned
#   vars.SIGNPATH_ORGANIZATION_ID    from the SignPath approval e-mail
#   vars.SIGNPATH_PROJECT_SLUG       default "fptg"
#   vars.SIGNPATH_POLICY_SLUG        default "release-signing"
#   secrets.TELEGRAM_API_ID          optional: Telegram API keys built into
#   secrets.TELEGRAM_API_HASH        the server; without them it asks for them

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building fptg $v"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lazarus and packages
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable
          include-packages: 'Synapse 40.1, BGRABitmap, BGRAControls, QRCodeGenLib'

      - name: Telegram API keys (optional)
        if: env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != ''
        run: |
          mkdir -p fptg-server-premium
          {
            echo 'const'
            echo "  BUILTIN_API_ID: integer = $TELEGRAM_API_ID;"
            echo "  BUILTIN_API_HASH: string = '$TELEGRAM_API_HASH';"
          } > fptg-server-premium/apikeys.inc

      - name: Build
        run: python tools/build_release.py "$VERSION" --build-only

      - name: Upload the unsigned programs
        id: unsigned
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-${{ env.VERSION }}
          path: |
            fptg-server/fptg-server.exe
            fptg-server/fptg-server-gui.exe
            fptg-client/fptg-client.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'fptg' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each release is approved by hand in SignPath: up to 5 hours.
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Put the signed programs in place
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          cp signed/fptg-server/fptg-server.exe signed/fptg-server/fptg-server-gui.exe fptg-server/
          cp signed/fptg-client/fptg-client.exe fptg-client/

      - name: Package
        run: python tools/build_release.py "$VERSION" --no-build

      - name: Draft the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: fptg ${{ env.VERSION }}
          draft: true
          files: |
            dist/fptg-server-${{ env.VERSION }}-win64.zip
            dist/fptg-client-${{ env.VERSION }}-win64.zip
            dist/SHA256SUMS.txt
