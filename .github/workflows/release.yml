# Builds a Windows release on GitHub's own machines and drafts a GitHub
# Release with the archives. Publishing the draft posts it to the Telegram
# channel (announce.yml).
#
# Start it:
#   - by pushing a tag:  git tag v1.0.0  then  git push origin v1.0.0
#   - or by hand: Actions → Release → Run workflow, enter the version.
#
# Repository secrets it reads (Settings → Secrets and variables → Actions):
#   TELEGRAM_API_ID      optional: Telegram API keys built into the server;
#   TELEGRAM_API_HASH    without them it asks for its own
#   FPTG_ANDROID_KEYSTORE           the Android app's signing key (.jks), base64;
#   FPTG_ANDROID_KEYSTORE_PASSWORD  its password (the key's is the same).
#                        Without them no APK: an unsigned one does not install,
#                        and a key other than the release one breaks updates.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ANDROID_KEYSTORE_B64: ${{ secrets.FPTG_ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FPTG_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the tags and commits, for the release notes

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building fptg $v"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      # Not through setup-lazarus's include-packages: it registers every .lpk
      # in the OPM archives (Android, fpGUI variants) and fails on them.
      - name: Lazarus packages
        run: python tools/ci_packages.py "$RUNNER_TEMP/opm"

      - name: Telegram API keys (optional)
        if: env.TELEGRAM_API_ID != '' && env.TELEGRAM_API_HASH != ''
        run: |
          mkdir -p fptg-server-premium
          {
            echo 'const'
            echo "  BUILTIN_API_ID: integer = $TELEGRAM_API_ID;"
            echo "  BUILTIN_API_HASH: string = '$TELEGRAM_API_HASH';"
          } > fptg-server-premium/apikeys.inc

      - name: Build and package
        run: python tools/build_release.py "$VERSION"

      # The Android app (fptg-android): the same page in a WebView, signed
      # with the release key from the secrets.
      - uses: actions/setup-java@v4
        if: env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_PASSWORD != ''
        with:
          distribution: temurin
          java-version: '17'

      - name: Android app
        if: env.ANDROID_KEYSTORE_B64 != '' && env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          key="$RUNNER_TEMP/fptg-release.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$key"
          export FPTG_KEYSTORE="$key" FPTG_KEY_ALIAS=fptg
          export FPTG_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" FPTG_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          (cd fptg-android && ./gradlew --no-daemon assembleRelease -PfptgVersion="$VERSION")
          rm -f "$key"
          apk="fptg-android-$VERSION.apk"
          cp fptg-android/app/build/outputs/apk/release/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" >> SHA256SUMS.txt)

      - name: Release notes
        run: |
          # The commit messages since the previous tag, unwrapped; edit them
          # on the draft before publishing if needed.
          python tools/release_notes.py "v$VERSION" > notes.md
          cat notes.md

      - name: Draft the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: fptg ${{ env.VERSION }}
          draft: true
          body_path: notes.md
          files: |
            dist/fptg-server-${{ env.VERSION }}-win64.zip
            dist/fptg-client-${{ env.VERSION }}-win64.zip
            dist/fptg-android-${{ env.VERSION }}.apk
            dist/SHA256SUMS.txt
