# Posts every published release to the project's Telegram channel: the
# release notes, then the archives as files.
#
# Runs when a release is published (the draft from release.yml → Publish),
# or by hand: Actions → Announce → Run workflow, with a tag (e.g. v0.9.5)
# to post an older release again.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN   the bot's token from @BotFather; the bot must be an
#                        administrator of the channel with "Post messages"
#   TELEGRAM_CHANNEL     the channel: @name or its numeric id (-100…)

name: Announce

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.9.5'
        required: true

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the settings
        run: |
          if [ -z "$BOT" ] || [ -z "$CHANNEL" ]; then
            echo "::error::Set the TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL secrets under Settings → Secrets and variables → Actions (not Codespaces)."
            exit 1
          fi

      # The commits, for notes when the release has none.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release notes and files
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          mkdir -p files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files --clobber
          ls -la files
          if [ -z "$(ls -A files)" ]; then
            echo "::error::The release $TAG has no files to post."
            exit 1
          fi

      - name: Post the notes
        run: |
          name=$(jq -r '.name' release.json)
          body=$(jq -r '.body // ""' release.json)
          url=$(jq -r '.url' release.json)
          # No notes on the release — the commit messages since the previous tag.
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            body=$(python3 tools/release_notes.py "$TAG")
          fi
          # Plain text, no parse mode: notes are Markdown, and Telegram
          # would reject or mangle what it cannot parse.
          text=$(printf '%s\n\n%s\n\n%s' "$name" "$body" "$url" | head -c 4000)
          jq -n --arg chat "$CHANNEL" --arg text "$text" \
            '{chat_id: $chat, text: $text, disable_web_page_preview: true}' > message.json
          if ! curl -sS --fail-with-body -o answer.json -H 'Content-Type: application/json' \
               -d @message.json "https://api.telegram.org/bot$BOT/sendMessage"; then
            cat answer.json
            exit 1
          fi
          rm -f answer.json

      - name: Post the archives
        run: |
          # One album of documents (up to ten; a bot may upload up to 50 MB each).
          shopt -s nullglob
          args=()
          media='['
          i=0
          for f in files/*; do
            [ $i -gt 0 ] && media+=','
            media+="{\"type\":\"document\",\"media\":\"attach://f$i\"}"
            args+=(-F "f$i=@$f")
            i=$((i + 1))
          done
          media+=']'
          echo "media: $media"
          # --form-string, not -F, for both: curl reads "-F name=@x" as the
          # file x, and the channel is "@name" (curl error 26); the JSON
          # goes as it is.
          if ! curl -sS --fail-with-body -o answer.json --form-string "chat_id=$CHANNEL" \
               --form-string "media=$media" "${args[@]}" \
               "https://api.telegram.org/bot$BOT/sendMediaGroup"; then
            cat answer.json
            exit 1
          fi
          echo "Posted $i files"
