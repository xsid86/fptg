<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG Orchestrator</title>
<link rel="stylesheet" href="assets/scss/style.css">
<link rel="stylesheet" href="assets/vendor/photoswipe/photoswipe.css">
<script>
  // Runs before the first paint on purpose. The modules below are
  // deferred, so letting them do this would show the wrong theme for a
  // frame and then swap it. It sets an ATTRIBUTE, not a style - the
  // rule in core/dom.js is about the style attribute, and the whole
  // palette hangs off [data-theme] in scss/base/_root.scss.
  // No stored choice means no attribute, which is what lets the OS
  // preference keep deciding.
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') { document.documentElement.dataset.theme = t; }
  } catch (e) { /* storage blocked: the OS preference still applies */ }
</script>
</head>
<body>
<script>
  // Sits here, not in <head>, because a script in the head cannot reach
  // an element that has not been parsed yet - and not in a module,
  // because those are deferred and would paint one background before
  // swapping to the other.
  //
  // data-scheme on <body> is the RESOLVED theme and is always either
  // "light" or "dark". That is the difference from data-theme on <html>,
  // which is the CHOICE and is absent when there is none - which is
  // exactly when a selector written against it would silently fail to
  // match. Style the background off this one:
  //     body[data-scheme="dark"] { background-image: url(...); }
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) { /* blocked */ }
    if (t !== 'dark' && t !== 'light') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.body.dataset.scheme = t;
  })();
</script>

<!--
  The shell is static markup; JavaScript fills the parts that change and
  never builds a whole page from scratch. Icons are placeholders here
  (data-icon) and get swapped for real <use> nodes once the sprite is in
  the document - see assets/js/util/icons.js for why the sprite is
  injected rather than referenced across files.
-->
<div class="app" data-view="list">

  <aside class="app__sidebar">
    <div class="sidebar">
      <div class="sidebar__head">
        <h1 class="sidebar__title">Chats</h1>
        <span class="sidebar__spacer"></span>
        <label class="btn btn--ghost" title="Show archived chats">
          <input type="checkbox" id="chats-archived">
          archive
        </label>
        <button class="btn btn--icon" id="chats-refresh" type="button" title="Reload">
          <span class="icon" data-icon="refresh"></span>
          <span class="u-sr-only">Reload the chat list</span>
        </button>
      </div>

      <div class="sidebar__search">
        <label class="field">
          <span class="icon icon--sm" data-icon="search"></span>
          <input class="field__input" id="chats-search" type="search"
                 placeholder="Filter by name or preview" autocomplete="off">
        </label>
      </div>

      <div class="sidebar__body">
        <div class="chat-list" id="chat-list"></div>
      </div>
    </div>
  </aside>

  <section class="app__workspace">
    <div class="workspace">
      <header class="chat-header" id="chat-header" hidden></header>

      <!-- The scroller and the box it sits in are two elements on
           purpose: the "jump to the newest" button is positioned
           against the box, and a button placed in the scroller itself
           would scroll away with the messages. -->
      <div class="workspace__history">
        <div class="history" id="history"></div>
      </div>

      <div class="composer" id="composer">
        <div class="composer__toolbar">
          <button class="btn composer__format" type="button" title="Bold"
                  data-fmt="bold" disabled>Bold</button>
          <button class="btn composer__format" type="button" title="Italic"
                  data-fmt="italic" disabled>Italic</button>
          <button class="btn composer__format" type="button" title="Underline"
                  data-fmt="underline" disabled>Underline</button>
          <button class="btn composer__format" type="button" title="Strikethrough"
                  data-fmt="strike" disabled>Strike</button>
          <button class="btn composer__format" type="button" title="Monospace"
                  data-fmt="mono" disabled>Mono</button>
          <button class="btn composer__format" type="button" title="Code block"
                  data-fmt="code" disabled>Code</button>
          <button class="btn composer__format" type="button" title="Spoiler"
                  data-fmt="spoiler" disabled>Spoiler</button>
          <button class="btn composer__format" type="button" title="Quote"
                  data-fmt="quote" disabled>Quote</button>
          <button class="btn composer__format" type="button" title="Link"
                  data-fmt="link" disabled>Link</button>
          <button class="btn composer__format" type="button" title="Strip formatting"
                  data-fmt="clear" disabled>Clear</button>

          <span class="composer__spacer"></span>

          <!-- The one icon in this row, and the one that earns it: a
               smiley says "emoji" in every client there is, and the
               panel behind it also holds stickers and GIFs, which no
               single word covers. Kept on the right, beside the two
               toggles: everything to the left of the spacer acts on the
               SELECTION, and this does not. -->
          <button class="btn btn--icon composer__emoji" id="composer-emoji"
                  type="button" title="Emoji, stickers and GIFs" disabled>
            <span class="icon" data-icon="smile"></span>
            <span class="u-sr-only">Emoji, stickers and GIFs</span>
          </button>

          <label class="btn btn--toggle" title="Write in HTML instead of MarkdownV2">
            <input type="checkbox" id="composer-html"> HTML
          </label>
          <label class="btn btn--toggle" title="Send without a notification">
            <input type="checkbox" id="composer-silent"> Silent
          </label>
        </div>

        <div class="composer__row">
          <textarea class="composer__input" rows="1"
                    placeholder="Pick a chat to start writing"></textarea>
          <button class="composer__send" type="button" title="Send">
            <span class="icon" data-icon="send"></span>
            <span class="u-sr-only">Send</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <footer class="app__status status-bar" id="status-bar">
    <div class="conn"></div>
    <span class="status-bar__spacer"></span>
    <div class="status-bar__counts"></div>
    <a class="status-bar__item" href="check.html">transport check</a>
    <button class="status-bar__theme" type="button" id="theme-toggle"></button>
  </footer>

</div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
