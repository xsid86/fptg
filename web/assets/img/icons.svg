<?xml version="1.0" encoding="utf-8"?>
<!--
  GUI icon sprite. Original glyphs drawn for this project on a 16x16
  grid, deliberately plain geometry so they stay legible at the 12px
  the chat list uses.

  These are UI icons only. Anything that comes out of Telegram (avatars,
  photos, stickers, custom emoji) is media and is served from the TDLib
  cache instead - it never belongs in here.

  No fill is set on the paths: every icon inherits currentColor from
  whatever it sits in, which is what lets one file serve the per-chat
  accent colours without a second copy in another tint.

  Used through <svg class="icon"><use href="#i-pin"></use></svg>. The
  sprite is fetched once and injected into the document by
  js/util/icons.js, so <use> resolves against the same document and the
  glyphs remain styleable.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ==================== chat kinds ==================== -->
  <symbol id="i-person" viewBox="0 0 16 16">
    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 9.4c-3 0-5.5 1.5-5.5 3.3V15h11v-2.3c0-1.8-2.5-3.3-5.5-3.3z"/>
  </symbol>

  <symbol id="i-group" viewBox="0 0 16 16">
    <path d="M5.8 8a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2zM5.8 9.2C3.4 9.2 1 10.4 1 12v2h9.6v-2c0-1.6-2.4-2.8-4.8-2.8z"/>
    <path d="M11.6 8.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM11.6 9.4c-.5 0-1 .05-1.4.15.9.7 1.4 1.6 1.4 2.45V14H15v-2c0-1.4-1.7-2.6-3.4-2.6z"/>
  </symbol>

