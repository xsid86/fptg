    <path fill-rule="evenodd" d="M3.4 4h9.2A1.4 1.4 0 0 1 14 5.4v6.2a1.4 1.4 0 0 1-1.4 1.4H3.4A1.4 1.4 0 0 1 2 11.6V5.4A1.4 1.4 0 0 1 3.4 4zm2.2 3a1.1 1.1 0 1 0 0 2.2A1.1 1.1 0 0 0 5.6 7zm4.8 0a1.1 1.1 0 1 0 0 2.2A1.1 1.1 0 0 0 10.4 7z"/>
  </symbol>

  <symbol id="i-lock" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M8 1a3.2 3.2 0 0 0-3.2 3.2V6H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.8V4.2A3.2 3.2 0 0 0 8 1zm0 1.6a1.6 1.6 0 0 1 1.6 1.6V6H6.4V4.2A1.6 1.6 0 0 1 8 2.6z"/>
