<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fptg</title>
<!-- Вход на сервер. В окне fptg — из файлов окна, адрес сервера
     вводится; в браузере — с самого сервера, адрес не нужен. Классы —
     экрана входа (.auth), своего SCSS нет. -->
<link rel="stylesheet" href="assets/scss/style.css">
<script src="assets/js/connect.js" defer></script>
</head>
<body>
<div class="auth" id="auth">
  <div class="auth__backdrop">
    <div class="auth__card">
      <h1 class="auth__title">Sign in to the server</h1>
      <p class="auth__note" id="note">The server prints its address and port when it
        starts. The user is created there with --add-user.</p>
      <form class="auth__form" id="form">
        <label class="auth__field" id="hostField">
          <span class="auth__label">Address</span>
          <input class="auth__input" type="text" id="host"
            spellcheck="false" autocomplete="off" placeholder="127.0.0.1">
        </label>
        <label class="auth__field" id="portField">
          <span class="auth__label">Port</span>
          <input class="auth__input" type="text" id="port" inputmode="numeric"
            autocomplete="off" placeholder="7654">
        </label>
        <label class="auth__field">
          <span class="auth__label">User</span>
          <input class="auth__input" type="text" id="user"
            spellcheck="false" autocomplete="username">
        </label>
        <label class="auth__field">
          <span class="auth__label">Password</span>
          <input class="auth__input" type="password" id="password"
            autocomplete="current-password">
        </label>
        <button class="auth__submit" type="submit" id="submit">Sign in</button>
      </form>
      <div id="cert" hidden>
        <p class="auth__error" id="certWarn"></p>
        <p class="auth__note">Compare this SHA-256 fingerprint with the one the
          server printed when it started. Trust it only if they match.</p>
        <p class="auth__note"><code id="certPrint"></code></p>
        <form class="auth__form" id="certForm">
          <button class="auth__submit" type="submit">Trust this certificate and sign in</button>
        </form>
      </div>
      <p class="auth__error" id="error" hidden></p>
    </div>
  </div>
</div>
</body>
</html>
