<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoming call</title>
<link rel="stylesheet" href="assets/scss/style.css">
<script>
  // The theme — before the first paint, as in index.html: the same choice
  // from localStorage (the shared WebView2 profile), otherwise Aurora.
  try {
    var t = localStorage.getItem('theme');
    // dark | light | dark-plain | light-plain | dark-aurora (ui/theme.js):
    // the scheme — in data-theme, the plain ones and Aurora also have data-style (plain | aurora).
    // No choice — Aurora (DEFAULT_THEME there too).
    if (!/^(dark|light)(-plain|-aurora)?$/.test(t || '')) { t = 'dark-aurora'; }
    document.documentElement.dataset.theme = t.indexOf('dark') === 0 ? 'dark' : 'light';
    var s = /-(plain|aurora)$/.exec(t);
    if (s) { document.documentElement.dataset.style = s[1]; }
    // The accent (Settings → General, ui/theme.js): a key from $app-accents.
    var a = localStorage.getItem('accent');
    if (/^[a-z]+$/.test(a || '')) { document.documentElement.dataset.accent = a; }
  } catch (e) {
    // The storage is closed — the default theme, Aurora.
    document.documentElement.dataset.theme = 'dark';
    document.documentElement.dataset.style = 'aurora';
  }
</script>
</head>
<body class="callcard-page">
<!-- The incoming call card in a separate small window on top of all windows
     (the shell: callpopup.pas). Everything needed is in the address: id, name,
     video, avatar, thumb. It does not ask the server: presses go to the shell,
     which passes them to the main page (ui/call.js). -->
<script type="module" src="assets/js/callcard.js"></script>
</body>
</html>
