<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fptg - transport check</title>
<link rel="stylesheet" href="assets/scss/style.css">
<script>
  // The theme — as in index.html: the choice (data-theme) before the first
  // paint, otherwise the page is always in the Windows theme, not the one chosen in the app.
  try {
    var t = localStorage.getItem('theme');
    // dark | light | dark-plain | light-plain | dark-aurora (ui/theme.js):
    // the scheme — in data-theme, the plain ones and Aurora also have data-style (plain | aurora).
    // No choice — Aurora (DEFAULT_THEME there too).
    if (!/^(dark|light)(-plain|-aurora)?$/.test(t || '')) { t = 'dark-aurora'; }
    document.documentElement.dataset.theme = t.indexOf('dark') === 0 ? 'dark' : 'light';
    var s = /-(plain|aurora)$/.exec(t);
    if (s) { document.documentElement.dataset.style = s[1]; }
    // The accent (Settings → General, ui/theme.js): a key from $app-accents.
    var a = localStorage.getItem('accent');
    if (/^[a-z]+$/.test(a || '')) { document.documentElement.dataset.accent = a; }
  } catch (e) {
    // The storage is closed — the default theme, Aurora.
    document.documentElement.dataset.theme = 'dark';
    document.documentElement.dataset.style = 'aurora';
  }
</script>
</head>
<body class="page-check">
<script>
  // The resulting theme on <body> (data-scheme) — the page background goes by
  // it, as in the app (see index.html).
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) { /* blocked */ }
    if (/^(dark|light)(-plain|-aurora)?$/.test(t || '')) {
      t = t.indexOf('dark') === 0 ? 'dark' : 'light';
    } else {
      t = 'dark';                 // the default is Aurora, and it is dark
    }
    document.body.dataset.scheme = t;
  })();
</script>

<!--
  The diagnostic page, kept because it is what proves the socket itself
  rather than the app on top of it: echo, a 200 KB frame (the 64-bit
  length path), and a burst. Its own entry script - it must keep working
  even when main.js does not.
-->
<div class="check__head">
  <strong>Transport check</strong>
  <div class="conn" id="conn"></div>
  <span class="check__spacer"></span>
  <span class="u-dim u-tabular">rtt <b id="rtt">-</b> ms</span>
  <span class="u-dim u-tabular">in <b id="nin">0</b></span>
  <span class="u-dim u-tabular">bytes <b id="nbytes">0</b></span>
  <a href="index.html">back to the app</a>
</div>

<div class="check__log" id="log"></div>

<div class="check__foot">
  <input class="check__input" id="msg" type="text" placeholder="text to echo back..." autocomplete="off">
  <button class="btn btn--primary" id="send" type="button">Send</button>
  <button class="btn" id="big" type="button">Send 200 KB</button>
  <button class="btn" id="burst" type="button">Burst x50</button>
  <button class="btn" id="clear" type="button">Clear</button>
</div>

<script type="module" src="assets/js/check.js"></script>
</body>
</html>
